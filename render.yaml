services:
  - type: web
    name: fake-artist-backend
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install
    startCommand: cd server && npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-url.com
    staticPublishPath: server
    autoDeploy: false
